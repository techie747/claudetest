<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art and Space LA - Blog Topic Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .submitted-topic {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-style: italic;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: #999;
            font-size: 14px;
        }

        .timer {
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
        }

        .success-message {
            margin-top: 30px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .success-content {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #667eea;
            margin-bottom: 20px;
        }

        .success-content p {
            color: #333;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .success-content .email-highlight {
            color: #667eea;
            font-weight: 600;
            font-size: 18px;
        }

        .new-topic-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .new-topic-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Art and Space LA<br><small style="font-size: 18px; color: #777;">Blog Topic Ideas</small></h1>
        <form id="topicForm">
            <div class="form-group">
                <label for="topic">What event or venue topic would you like us to write about?</label>
                <textarea
                    id="topic"
                    name="topic"
                    placeholder="e.g., How to Choose the Perfect Art Gallery for Your Corporate Event"
                    required
                ></textarea>
            </div>
            <div class="form-group">
                <label for="email">Email Address (to receive your blog)</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">Generate Topic</button>
        </form>
        <div id="message" class="message"></div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div class="loading-text">Generating Your Blog...</div>
            <div class="loading-subtext">This may take 3-4 minutes. Please wait.</div>
            <div class="timer" id="timer">Elapsed time: 0:00</div>
        </div>

        <div id="successMessage" class="success-message">
            <div class="success-content">
                <p id="successText"></p>
            </div>
            <button class="new-topic-btn" onclick="resetForm()">Generate Another Blog Topic</button>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION: Add your webhook URL here
        // ============================================
        const WEBHOOK_URL = 'YOUR_WEBHOOK_URL_HERE';
        // ============================================

        const form = document.getElementById('topicForm');
        const topicInput = document.getElementById('topic');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');
        const successMessageDiv = document.getElementById('successMessage');
        const successTextDiv = document.getElementById('successText');
        const timerDiv = document.getElementById('timer');

        let timerInterval = null;
        let elapsedSeconds = 0;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const topic = topicInput.value.trim();
            const email = emailInput.value.trim();

            if (!topic) {
                showMessage('Please enter a blog topic', 'error');
                return;
            }

            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            // Check if webhook URL is configured
            if (!WEBHOOK_URL || WEBHOOK_URL === 'YOUR_WEBHOOK_URL_HERE') {
                showMessage('Webhook URL not configured. Please update the WEBHOOK_URL in the script.', 'error');
                return;
            }

            // Hide form and show loading
            form.style.display = 'none';
            messageDiv.classList.remove('show');
            loadingDiv.classList.add('show');

            // Start timer
            startTimer();

            try {
                // Prepare the payload
                const payload = {
                    topic: topic,
                    email: email,
                    timestamp: new Date().toISOString(),
                    source: 'art-and-space-la',
                    venue: 'Art and Space LA'
                };

                // Send to webhook (don't wait for response)
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                }).catch(err => {
                    console.log('Webhook triggered:', err);
                });

                // Immediately show success message
                stopTimer();
                loadingDiv.classList.remove('show');

                // Create success message HTML
                const successHTML = `
                    Your blog about "<strong>${topic}</strong>" is being generated!<br><br>
                    This process takes approximately 3-4 minutes to ensure high-quality content.<br><br>
                    You will receive your completed blog at:<br>
                    <span class="email-highlight">${email}</span><br><br>
                    Thank you for your patience!
                `;

                successTextDiv.innerHTML = successHTML;
                successMessageDiv.classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                stopTimer();
                loadingDiv.classList.remove('show');
                form.style.display = 'block';
                showMessage('Failed to submit request. Please try again.', 'error');
            }
        });

        function resetForm() {
            // Hide success message
            successMessageDiv.classList.remove('show');

            // Clear form
            topicInput.value = '';
            emailInput.value = '';

            // Show form again
            form.style.display = 'block';
        }

        function showMessage(text, type) {
            messageDiv.innerHTML = text;
            messageDiv.className = 'message ' + type + ' show';

            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }

        function startTimer() {
            elapsedSeconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedSeconds / 60);
            const seconds = elapsedSeconds % 60;
            timerDiv.textContent = `Elapsed time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
